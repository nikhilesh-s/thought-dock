<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 570' width='980' height='570' font-family='-apple-system, Helvetica, Arial, sans-serif'><title>System architecture</title><defs><marker id='a' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
<path d='M0,1 L10,5 L0,9 z' fill='#b2380b'/></marker>
<marker id='f' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto'>
<path d='M0,1 L10,5 L0,9 z' fill='#1d1d1f'/></marker></defs><rect width='980' height='570' fill='white'/><rect x='30' y='70' width='220' height='150' rx='14' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='140.0' y='96' font-size='15' fill='#1d1d1f' text-anchor='middle' font-weight='700' >Phone: /capture</text><text x='140.0' y='120' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Text, voice (MediaRecorder)</text><text x='140.0' y='139' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Live transcript (Web Speech)</text><text x='140.0' y='158' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Photo (downscaled JPEG)</text><text x='140.0' y='177' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Offline queue (localStorage)</text><rect x='370' y='70' width='240' height='150' rx='14' fill='#f5f9ff' stroke='#0066cc' stroke-width='1.5' /><text x='490.0' y='96' font-size='15' fill='#1d1d1f' text-anchor='middle' font-weight='700' >Vercel: Next.js API</text><text x='490.0' y='120' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >POST /api/dock</text><text x='490.0' y='139' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >GET · PATCH /api/dock/:id</text><text x='490.0' y='158' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >PUT /api/dock/:id/media/:item</text><text x='490.0' y='177' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >POST · GET /api/pair</text><rect x='730' y='70' width='220' height='150' rx='14' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='840.0' y='96' font-size='15' fill='#1d1d1f' text-anchor='middle' font-weight='700' >Upstash Redis</text><text x='840.0' y='120' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >td:{dock}:items (hash)</text><text x='840.0' y='139' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >td:{dock}:spaces (hash)</text><text x='840.0' y='158' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >td:{dock}:media:{item}</text><text x='840.0' y='177' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >td:pair:{code} (10 min TTL)</text><rect x='370' y='300' width='240' height='150' rx='14' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='490.0' y='326' font-size='15' fill='#1d1d1f' text-anchor='middle' font-weight='700' >Desk: /desk (DeskOS)</text><text x='490.0' y='350' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Polls every 4 s + on focus</text><text x='490.0' y='369' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Optimistic ops + undo stack</text><text x='490.0' y='388' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Classifier runs in browser</text><text x='490.0' y='407' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >.ics export for events</text><rect x='730' y='300' width='220' height='150' rx='14' fill='#f5f5f7' stroke='#1d1d1f' stroke-width='1.5' /><text x='840.0' y='326' font-size='15' fill='#1d1d1f' text-anchor='middle' font-weight='700' >On-device model</text><text x='840.0' y='350' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Softmax regression</text><text x='840.0' y='369' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >836 features × 5 kinds</text><text x='840.0' y='388' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >lib/model.json (42 KB)</text><text x='840.0' y='407' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Suggests; user decides</text><line x1='250' y1='130' x2='370' y2='130' stroke='#1d1d1f' stroke-width='1.6' marker-end='url(#f)'/><text x='310.0' y='122.0' font-size='11.5' fill='#0066cc' text-anchor='middle' font-weight='600' >ops (JSON)</text><line x1='610' y1='130' x2='730' y2='130' stroke='#1d1d1f' stroke-width='1.6' marker-end='url(#f)'/><text x='670.0' y='122.0' font-size='11.5' fill='#0066cc' text-anchor='middle' font-weight='600' >HSET / HGETALL</text><line x1='490' y1='220' x2='490' y2='300' stroke='#1d1d1f' stroke-width='1.6' marker-end='url(#f)'/><text x='500' y='265' font-size='11.5' fill='#0066cc' text-anchor='start' font-weight='600' >dock JSON</text><line x1='470' y1='300' x2='470' y2='222' stroke='#1d1d1f' stroke-width='1.6' marker-end='url(#f)'/><text x='460' y='265' font-size='11.5' fill='#0066cc' text-anchor='end' font-weight='600' >ops</text><line x1='730' y1='375' x2='612' y2='375' stroke='#1d1d1f' stroke-width='1.6' marker-end='url(#f)'/><text x='671.0' y='367.0' font-size='11.5' fill='#0066cc' text-anchor='middle' font-weight='600' >suggestKind(text)</text><line x1='140' y1='220' x2='140' y2='520' stroke='#1d1d1f' stroke-width='1.6' marker-end='url(#f)'/><line x1='140' y1='520' x2='488' y2='520' stroke='#1d1d1f' stroke-width='1.6' stroke-dasharray='5 4'/><line x1='488' y1='520' x2='488' y2='452' stroke='#1d1d1f' stroke-width='1.6' stroke-dasharray='5 4' marker-end='url(#f)'/><text x='300' y='540' font-size='12' fill='#6e6e73' text-anchor='middle' font-weight='400' >Pairing: desk shows QR / 6-character code → phone redeems it → both hold the same 22-character dock key</text><text x='490' y='36' font-size='17' fill='#1d1d1f' text-anchor='middle' font-weight='700' >Thought Dock system architecture</text></svg>