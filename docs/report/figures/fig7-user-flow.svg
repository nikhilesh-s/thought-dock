<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 570' width='1120' height='570' font-family='-apple-system, Helvetica, Arial, sans-serif'><title>User flow</title><defs><marker id='a' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
<path d='M0,1 L10,5 L0,9 z' fill='#b2380b'/></marker>
<marker id='f' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto'>
<path d='M0,1 L10,5 L0,9 z' fill='#1d1d1f'/></marker></defs><rect width='1120' height='570' fill='white'/><text x='560' y='34' font-size='17' fill='#1d1d1f' text-anchor='middle' font-weight='700' >Capture now → organize later: user flow</text><rect x='20' y='60' width='1080' height='120' rx='12' fill='#fbfbfd' stroke='#c7c7cc' stroke-width='1.2' /><text x='36' y='82' font-size='10.5' fill='#6e6e73' text-anchor='start' font-weight='700' >PHONE (anytime)</text><rect x='20' y='200' width='1080' height='325' rx='12' fill='#fbfbfd' stroke='#c7c7cc' stroke-width='1.2' /><text x='36' y='222' font-size='10.5' fill='#6e6e73' text-anchor='start' font-weight='700' >DESK (when the student chooses)</text><rect x='40' y='100' width='150' height='52' rx='26' fill='#e6f0fa' stroke='#1d1d1f' stroke-width='1.5' /><text x='115.0' y='124' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Thought appears</text><text x='115.0' y='141' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >class, bus, 1 a.m.</text><rect x='240' y='100' width='170' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='325.0' y='124' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Open /capture</text><text x='325.0' y='141' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >already paired</text><rect x='460' y='100' width='190' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='555.0' y='124' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Type · speak · photo</text><text x='555.0' y='141' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >no folders, tags, dates</text><rect x='700' y='100' width='120' height='52' rx='10' fill='#e6f0fa' stroke='#1d1d1f' stroke-width='1.5' /><text x='760.0' y='124' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Save</text><text x='760.0' y='141' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >1 tap</text><rect x='870' y='100' width='200' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='970.0' y='124' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Toast: Saved · Undo</text><text x='970.0' y='141' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >queued if offline</text><line x1='190' y1='126' x2='240' y2='126' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><line x1='410' y1='126' x2='460' y2='126' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><line x1='650' y1='126' x2='700' y2='126' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><line x1='820' y1='126' x2='870' y2='126' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='40' y='250' width='170' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='125.0' y='274' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Open /desk</text><text x='125.0' y='291' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >Inbox shows count</text><path d='M970,152 C970,200 125,190 125,250' fill='none' stroke='#1d1d1f' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#f)'/><text x='985' y='172' font-size='10.5' fill='#0066cc' text-anchor='start' font-weight='600' >syncs within ~4 s</text><rect x='260' y='250' width='170' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='345.0' y='274' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Sort</text><text x='345.0' y='291' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >one thought at a time</text><rect x='480' y='250' width='200' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='580.0' y='274' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Suggestion chip</text><text x='580.0' y='291' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >"Looks like a Task"</text><line x1='210' y1='276' x2='260' y2='276' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><line x1='430' y1='276' x2='480' y2='276' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><polygon points='805.0,237 880,271 805.0,305 730,271' fill='#fff7e6' stroke='#1d1d1f' stroke-width='1.5'/><text x='805.0' y='276' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Student decides</text><line x1='680' y1='276' x2='730' y2='271' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><line x1='805' y1='305' x2='805' y2='335' stroke='#1d1d1f' stroke-width='1.4'/><line x1='150' y1='335' x2='960' y2='335' stroke='#1d1d1f' stroke-width='1.4'/><line x1='150' y1='335' x2='150' y2='358' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='40' y='360' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='150.0' y='384' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Task (T)</text><text x='150.0' y='401' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >due date optional</text><line x1='420' y1='335' x2='420' y2='358' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='310' y='360' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='420.0' y='384' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Event (E)</text><text x='420.0' y='401' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >.ics to calendar</text><line x1='690' y1='335' x2='690' y2='358' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='580' y='360' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='690.0' y='384' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Move (M)</text><text x='690.0' y='401' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >to a Space</text><line x1='960' y1='335' x2='960' y2='358' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='850' y='360' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='960.0' y='384' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Keep (K)</text><text x='960.0' y='401' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >idea / note / resource</text><line x1='285' y1='335' x2='285' y2='448' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='175' y='450' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='285.0' y='474' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Develop (D)</text><text x='285.0' y='491' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >add notes</text><line x1='555' y1='335' x2='555' y2='448' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='445' y='450' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='555.0' y='474' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Connect (C)</text><text x='555.0' y='491' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >link related thoughts</text><line x1='825' y1='335' x2='825' y2='448' stroke='#1d1d1f' stroke-width='1.4' marker-end='url(#f)'/><rect x='715' y='450' width='220' height='52' rx='10' fill='white' stroke='#1d1d1f' stroke-width='1.5' /><text x='825.0' y='474' font-size='13' fill='#1d1d1f' text-anchor='middle' font-weight='600' >Archive (A)</text><text x='825.0' y='491' font-size='10.5' fill='#6e6e73' text-anchor='middle' font-weight='400' >never deleted</text><text x='560' y='548' font-size='12.5' fill='#0066cc' text-anchor='middle' font-weight='700' >⌘Z (or U) undoes any step. Nothing is ever deleted without a confirm.</text></svg>