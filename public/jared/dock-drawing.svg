<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" role="img" aria-labelledby="tdd-title tdd-desc"><title id="tdd-title">Thought Dock Triangular Prism Dock, dimensioned multiview drawing</title><desc id="tdd-desc">Third-angle projection with top, front and right side views. A triangular prism 170 millimetres wide, 85 deep and 68 tall, with a vertical back and a front face sloped at 39.6 degrees (39 nominal), long edges rounded to 3 and 6 millimetres. On the sloped face: a 56 millimetre MagSafe puck recess 6 deep, and a 30 millimetre square NFC chip pocket 2 deep above it. A 6 millimetre internal cable channel runs from the recess floor to an 8 millimetre exit hole in the back.</desc><defs><style>.tdd-o{fill:none;stroke:#111111;stroke-width:.5;stroke-linejoin:round}.tdd-s{fill:none;stroke:#111111;stroke-width:.3}.tdd-h{fill:none;stroke:#111111;stroke-width:.3;stroke-dasharray:2 1.2}.tdd-c{fill:none;stroke:#6e6e73;stroke-width:.2;stroke-dasharray:7 1.5 1.2 1.5}.tdd-d{stroke:#111111;stroke-width:.18}.tdd-t,.tdd-vt,.tdd-lb{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#111111;paint-order:stroke;stroke:#ffffff;stroke-width:.9px;stroke-linejoin:round}.tdd-t{font-size:3px}.tdd-vt{font-size:3.4px;font-weight:600}.tdd-lb{font-size:2px;fill:#6e6e73;letter-spacing:.1px}</style><marker id="tdd-ar" viewBox="0 0 10 4" refX="10" refY="2" markerUnits="userSpaceOnUse" markerWidth="3" markerHeight="1.2" orient="auto-start-reverse"><path d="M0,0L10,2L0,4z" fill="#111111"/></marker></defs><rect width="420" height="297" fill="#ffffff"/><rect x="10" y="10" width="400" height="277" class="tdd-o"/><rect x="50" y="65" width="170" height="85" class="tdd-o"/><line x1="50" y1="148.91" x2="220" y2="148.91" class="tdd-s"/><line x1="50" y1="74.83" x2="220" y2="74.83" class="tdd-s"/><line x1="50" y1="71" x2="220" y2="71" class="tdd-s"/><ellipse cx="135" cy="124.97" rx="28" ry="21.57" class="tdd-o"/><polygon points="120,1